name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloudflare preview smoke
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Cloudflare Pages truncates branch aliases to 28 characters.
          slug=$(printf '%s' "$GITHUB_HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-28 | sed -E 's#-+$##g')
          export PREVIEW_BASE_URL="https://${slug}.booking-wizard-ai-salesman.pages.dev"
          export EXPECTED_COMMIT="$PR_HEAD_SHA"
          echo "Testing ${PREVIEW_BASE_URL} at PR head ${EXPECTED_COMMIT}"
          node scripts/preview-smoke.mjs

      - name: Cloudflare production smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREVIEW_BASE_URL: https://booking-wizard-ai-salesman.pages.dev
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          echo "Testing ${PREVIEW_BASE_URL} at production commit ${EXPECTED_COMMIT}"
          node scripts/preview-smoke.mjs